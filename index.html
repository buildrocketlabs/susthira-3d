html,body{margin:0;height:100%;background:#0B271D;overflow:hidden;overscroll-behavior:none}
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;

#intro img{width:76px;height:auto;opacity:.01;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .15s forwards}
#intro h1{font:500 clamp(30px,8.4vw,44px)/1.15 Fraunces,Georgia,serif;margin:30px 0 0;letter-spacing:-.01em;opacity:.01;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .95s forwards}
#intro p{font:600 clamp(18px,5vw,23px)/1.5 "Noto Sans Kannada",sans-serif;margin:12px 0 0;color:#C9A04A;opacity:.01;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) 1.45s forwards}
#intro .bar{width:132px;height:2px;border-radius:2px;background:rgba(244,239,227,.14);margin-top:38px;overflow:hidden;opacity:0;animation:show .8s ease 3.4s forwards}
#intro .bar i{display:block;height:100%;width:100%;background:#C9A04A;transform-origin:0 50%;transform:scaleX(.04);transition:transform .5s ease}
#intro small{position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));font:400 14px/1.4 system-ui,sans-serif;color:rgba(244,239,227,.5);opacity:0;animation:show 1s ease 2.6s forwards}
@keyframes rise{from{opacity:.01;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#intro img,#intro h1,#intro p{animation-duration:.01s;animation-delay:0s}}
